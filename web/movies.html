<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movies · Room</title>
<link rel="stylesheet" href="/room.css">
<style>
  body { background: #0b0a0f; }
  /* the selected title, large: its poster blurred into the background */
  #bd { position: absolute; left: -8%; top: -8%; width: 116%; height: 116%; background: #1a1622 center/cover no-repeat;
    -webkit-filter: blur(4.5vw) saturate(1.25) brightness(.5); filter: blur(4.5vw) saturate(1.25) brightness(.5); }
  .veil { position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    background: -webkit-linear-gradient(top, rgba(11,10,15,.15), rgba(11,10,15,.6) 50%, rgba(11,10,15,.96) 75%);
    background: linear-gradient(to bottom, rgba(11,10,15,.15), rgba(11,10,15,.6) 50%, rgba(11,10,15,.96) 75%); }
  .hero { position: absolute; left: 5vw; right: 34vw; top: 8vh; }
  .hero .k { font-size: 1.1vw; letter-spacing: .3em; text-transform: uppercase; color: #f6c26b; font-weight: 700; }
  .hero h1 { font-size: 4.6vw; line-height: 1; margin: 1.2vh 0 0; max-height: 2.1em; overflow: hidden; }
  .hero .st { font-size: 1.5vw; color: rgba(243,237,228,.8); margin-top: 1.8vh; }
  .hero .st b { color: #f6c26b; font-weight: 600; }
  .hero .bar { height: .6vh; width: 40%; background: rgba(255,255,255,.18); border-radius: 99px; margin-top: 1.6vh; overflow: hidden; }
  .hero .bar i { display: block; height: 100%; background: #f6c26b; }
  /* a film coming down from iCloud: how far it's got */
  .dl { position: absolute; left: 5vw; top: 31vh; width: 36vw; background: rgba(20,14,26,.92); padding: 1.6vh 1.6vw 1.8vh 2vw; display: none; z-index: 4; }
  .dl.on { display: block; }
  .dl:before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: .45vw; background: #f6c26b; }
  .dl .k { font-size: 1vw; letter-spacing: .3em; text-transform: uppercase; color: #f6c26b; font-weight: 700; }
  .dl .t { font-size: 2vw; margin-top: .8vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dl .c { font-size: 1.3vw; color: rgba(243,237,228,.75); margin-top: .6vh; }
  .dl .bar { height: .8vh; background: rgba(255,255,255,.15); border-radius: 99px; margin-top: 1.2vh; overflow: hidden; }
  .dl .bar i { display: block; height: 100%; width: 0; background: #f6c26b; -webkit-transition: width 1s; transition: width 1s; }
  .hero .fold { font-size: 1.1vw; color: rgba(243,237,228,.45); margin-top: 1.6vh; }
  #hp { position: absolute; right: 5vw; top: 6vh; width: 26vw; height: 40vh; background: center/contain no-repeat; }

  /* shelves: the current one big, the next one peeking */
  #shelves { position: absolute; left: 5vw; right: 0; top: 52vh; bottom: 0; overflow: hidden; }
  .shelf { margin-bottom: 2.4vh; }
  .shelf .name { font-size: 1.35vw; font-weight: 600; color: rgba(243,237,228,.8); margin-bottom: 1.2vh; }
  .shelf .name span { color: rgba(243,237,228,.4); font-weight: 400; margin-left: .6vw; }
  .strip { white-space: nowrap; padding: 1vh 0 1.4vh 1vw; margin-left: -1vw; -webkit-transition: -webkit-transform .35s cubic-bezier(.2,.8,.2,1); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .card { display: inline-block; vertical-align: top; width: 9.4vw; height: 14.1vw; margin-right: 1.1vw; border-radius: .7vw;
    background: #221d2b center/cover no-repeat; position: relative; overflow: hidden; white-space: normal;
    box-shadow: 0 1vh 2vh rgba(0,0,0,.35); -webkit-transition: all .25s; transition: all .25s; }
  .card .ttl { position: absolute; left: .8vw; right: .8vw; bottom: 1.2vh; font-size: 1.15vw; line-height: 1.15; }
  .card.np { background: -webkit-linear-gradient(135deg, #3b2c4f, #17131f); background: linear-gradient(135deg, #3b2c4f, #17131f); }
  .card.np .ttl { font-family: "Instrument Serif", Georgia, serif; font-size: 1.35vw; line-height: 1.1; max-height: 5.5em; overflow: hidden; }
  .card.np .ep { display: block; font-family: Inter, sans-serif; font-size: .8vw; font-weight: 700; letter-spacing: .15em; color: #f6c26b; margin-bottom: .6vh; }
  .card .pip { position: absolute; left: 0; right: 0; bottom: 0; height: .5vh; background: rgba(0,0,0,.5); }
  .card .pip i { display: block; height: 100%; background: #f6c26b; }
  .card .cl { position: absolute; right: .5vw; top: .6vh; font-size: .85vw; font-weight: 700; padding: .2vh .55vw; border-radius: 99px; background: #f6c26b; color: #1a1220; }
  .card.sel { box-shadow: 0 0 0 .28vw #f6c26b, 0 2vh 4vh rgba(0,0,0,.6); -webkit-transform: scale(1.07); transform: scale(1.07); }
  .shelf.next { opacity: .45; }
  .shelf.next .card { width: 7vw; height: 10.5vw; }

  .empty { position: absolute; left: 5vw; top: 30vh; font-size: 2vw; line-height: 1.5; max-width: 70vw; color: rgba(243,237,228,.75); }
  .empty b { color: #f6c26b; }
  #play { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000; display: none; }
  #play.on { display: block; }
  video { width: 100%; height: 100%; background: #000; }
  .osd { position: absolute; left: 0; right: 0; bottom: 0; padding: 4vh 5vw 5vh;
    background: -webkit-linear-gradient(top, rgba(0,0,0,0), rgba(0,0,0,.85)); background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.85));
    -webkit-transition: opacity .4s; transition: opacity .4s; }
  .osd.off { opacity: 0; }
  .osd h2 { font-size: 2.8vw; margin: 0 0 1.5vh; font-weight: 400; }
  .osd .bar { height: .8vh; background: rgba(255,255,255,.15); border-radius: 99px; overflow: hidden; }
  .osd .bar i { display: block; height: 100%; background: #f6c26b; }
  .osd .row { margin-top: 1.2vh; font-size: 1.5vw; color: rgba(243,237,228,.75); }
</style>
</head>
<body>
<div id="bd"></div><div class="veil"></div>
<div class="hero"><div class="k" id="hk"></div><h1 class="serif" id="ht"></h1><div class="st" id="hs"></div><div class="bar" id="hb" style="display:none"><i id="hbi"></i></div><div class="fold" id="folder"></div></div>
<div id="hp"></div>
<div class="dl" id="dl"><div class="k">Coming down from iCloud</div><div class="t serif" id="dlT"></div><div class="c" id="dlC"></div><div class="bar"><i id="dlBar"></i></div></div>
<div id="shelves"></div>
<div class="hint" id="hint" style="top:3.5vh;bottom:auto">◀ ▶ browse · ▲▼ shelves · OK play · 0 menu</div>

<div id="play">
  <video id="v" preload="auto"></video>
  <div id="sub"></div>
  <div class="osd off" id="osd">
    <h2 class="serif" id="ptitle"></h2>
    <div class="bar"><i id="pbar" style="width:0"></i></div>
    <div class="row"><span class="mono" id="ptime"></span><span class="grow"></span><span>OK pause · ◀ 10s · ▶ 30s · ▼ subtitles · ↩ list</span></div>
  </div>
</div>

<script src="/room.js"></script>
<script>
var list = [], sel = 0, cur = null, osdT = null, lastSave = 0, waiting = {}, sb = null;
var v = document.getElementById('v');

function clock(s) {
  s = Math.floor(s || 0);
  var h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return (h ? h + ':' + Room.pad(m) : m) + ':' + Room.pad(s % 60);
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function started(m) { return m.t > 0 && m.duration && m.t < m.duration - 120; }

function load() {
  return Room.get('/api/movies').then(function (r) {
    var keep = list[sel] && list[sel].id;
    list = r.movies;
    document.getElementById('folder').textContent = r.folder;
    build();
    if (keep) shelves.forEach(function (sh, ri) { sh.items.forEach(function (li, ci) { if (list[li].id === keep) { row = ri; cols[ri] = ci; } }); });
    var h = /r=(\d+)&c=(\d+)/.exec(location.hash);  // #r=1&c=3 opens a shelf at a title
    if (h && !keep) { row = +h[1]; cols[row] = +h[2]; }
    row = Math.min(row, Math.max(0, shelves.length - 1));
    draw(r);
  });
}

// Shelves: Continue watching, Films, then each show and course, in the server's order.
var shelves = [], row = 0, cols = {};
function groupOf(m) { return started(m) ? 'Continue watching' : m.group; }
function groupName(m) { return started(m) ? 'Continue watching' : m.group_name; }
function build() {
  var by = {};
  shelves = [];
  // what's on the Mac comes first: it plays the moment you press OK
  var now = [];
  list.forEach(function (m, i) { if (!m.cloud && m.plays) now.push(i); });
  if (now.length) shelves.push({ name: 'Ready to play', items: now });
  list.forEach(function (m, i) {
    var g = groupOf(m);
    if (!by[g]) { by[g] = { name: groupName(m), items: [] }; shelves.push(by[g]); }
    by[g].items.push(i);
  });
}
function status(m) {
  if (m.cloud) return waiting[m.id] ? '<b>Downloading from iCloud' + (waiting[m.id].pct ? ' · ' + waiting[m.id].pct + '%' : '…') + '</b> · it starts when it\'s here' : '<b>In iCloud</b> · OK brings it down first · ☆ it on the phone to keep it ready';
  if (started(m)) return '<b>Resume at ' + clock(m.t) + '</b> of ' + clock(m.duration);
  if (m.duration && m.t >= m.duration - 120) return 'Watched';
  return '<b>Plays now</b>' + (m.plays ? '' : ' · the TV may not play this format');
}
// an episode with no art reads "S1 · E04" over its name, not "Season 1, Episode 04 - ..." cut off mid-word
function npTitle(t) {
  var e = /Season\s*(\d+),?\s*Episode\s*(\d+)\s*[-–:.]?\s*(.*)/i.exec(t) || /S(\d\d)E(\d\d)(?: · (.*))?$/.exec(t);
  return e ? '<span class="ep">S' + (+e[1]) + ' · E' + (+e[2]) + '</span>' + esc(e[3] || 'Episode ' + (+e[2])) : esc(t);
}
function card(m, on) {
  var pct = started(m) ? Math.round(100 * m.t / m.duration) : 0;
  return '<div class="card' + (m.poster ? '' : ' np') + (on ? ' sel' : '') + '"' + (m.poster ? ' style="background-image:url(' + m.poster + ')"' : '') + '>' +
    (m.poster ? '' : '<div class="ttl">' + npTitle(m.title) + '</div>') + (m.cloud ? '' : '<span class="cl">▶ Ready</span>') +
    (pct ? '<div class="pip"><i style="width:' + pct + '%"></i></div>' : '') + '</div>';
}
function draw(r) {
  var el = document.getElementById('shelves');
  if (!list.length) {
    el.innerHTML = '<div class="empty">' + (r && r.missing
      ? 'There\'s no folder at <b>' + esc(r.folder) + '</b> yet. Make one in iCloud Drive and put movies in it, or pick another folder from the Room menu on the Mac.'
      : 'No movies in <b>' + esc(r ? r.folder : '') + '</b> yet. MP4, M4V, MOV and WebM files play best.') + '</div>';
    return;
  }
  var sh = shelves[row], col = Math.min(cols[row] || 0, sh.items.length - 1);
  cols[row] = col;
  sel = sh.items[col];
  var m = list[sel];
  // the hero: the selected title over its own poster, blurred
  document.getElementById('bd').style.backgroundImage = m.poster ? 'url(' + m.poster + ')' : 'none';
  document.getElementById('hp').style.backgroundImage = m.poster ? 'url(' + m.poster + ')' : 'none';
  document.getElementById('hk').textContent = sh.name + ' · ' + (col + 1) + ' of ' + sh.items.length;
  document.getElementById('ht').textContent = m.title;
  document.getElementById('hs').innerHTML = status(m);
  document.getElementById('hb').style.display = started(m) ? '' : 'none';
  document.getElementById('hbi').style.width = started(m) ? Math.round(100 * m.t / m.duration) + '%' : '0';
  // this shelf, scrolled so the selection stays in view, and the next one peeking underneath
  var html = '', shift = Math.max(0, col - 2) * 10.5;
  html += '<div class="shelf"><div class="name">' + esc(sh.name) + '<span>' + sh.items.length + '</span></div><div class="strip" style="-webkit-transform:translateX(-' + shift + 'vw);transform:translateX(-' + shift + 'vw)">' +
    sh.items.slice(Math.max(0, col - 12), col + 14).map(function (li) { return card(list[li], li === sel); }).join('') + '</div></div>';
  if (shelves[row + 1]) {
    var nx = shelves[row + 1];
    html += '<div class="shelf next"><div class="name">' + esc(nx.name) + '<span>' + nx.items.length + '</span></div><div class="strip">' +
      nx.items.slice(0, 14).map(function (li) { return card(list[li], false); }).join('') + '</div></div>';
  }
  el.innerHTML = html;
}

function move(d) { if (!list.length) return; cols[row] = Math.max(0, Math.min(shelves[row].items.length - 1, (cols[row] || 0) + d)); draw(); }
function jump(d) { if (!list.length) return; row = Math.max(0, Math.min(shelves.length - 1, row + d)); draw(); }

function choose(id) {
  var m = null;
  list.forEach(function (x, i) { if (x.id === id) { m = x; sel = i; } });
  m = m || list[sel];
  if (!m) return;
  if (m.cloud) {
    waiting[m.id] = { title: m.title };
    progress();
    Room.post('/api/movies/fetch', { id: m.id });
    Room.toast('Downloading from iCloud. It starts when it\'s here.', 4000);
    draw();
    return;
  }
  play(m);
}

function play(m) {
  cur = m;
  delete waiting[m.id];
  document.getElementById('play').className = 'on';
  document.getElementById('hint').style.display = 'none';
  document.getElementById('ptitle').textContent = m.title;
  v.src = '/media?id=' + encodeURIComponent(m.id);
  if (sb) sb.off();
  sb = Room.subs(v, m.id, document.getElementById('sub'));
  var at = started(m) ? m.t - 5 : 0;
  v.addEventListener('loadedmetadata', function once() {
    v.removeEventListener('loadedmetadata', once);
    if (at > 0) v.currentTime = at;
  });
  v.play();
  osd(5000);
}

function save(force) {
  if (!cur || !v.duration || isNaN(v.duration)) return;
  if (!force && Date.now() - lastSave < 10000) return;
  lastSave = Date.now();
  cur.t = Math.floor(v.currentTime); cur.duration = Math.floor(v.duration);
  return Room.post('/api/movies/pos', { id: cur.id, t: cur.t, duration: cur.duration });
}

function stop() {
  var saved = save(true);
  v.pause();
  v.removeAttribute('src');
  v.load();
  if (sb) { sb.off(); sb = null; }
  cur = null;
  document.getElementById('play').className = '';
  document.getElementById('hint').style.display = '';
  (saved || Promise.resolve()).then(load);  // after the save lands, so the list shows the new spot
}

function osd(ms) {
  var el = document.getElementById('osd');
  el.className = 'osd';
  clearTimeout(osdT);
  if (!v.paused) osdT = setTimeout(function () { el.className = 'osd off'; }, ms || 3500);
}

function seek(by) {
  if (!v.duration) return;
  v.currentTime = Math.max(0, Math.min(v.duration - 1, v.currentTime + by));
  osd();
}

function toggle() { if (v.paused) v.play(); else { v.pause(); save(true); } osd(); }

v.addEventListener('timeupdate', function () {
  if (!v.duration) return;
  document.getElementById('pbar').style.width = (100 * v.currentTime / v.duration) + '%';
  document.getElementById('ptime').textContent = clock(v.currentTime) + ' / ' + clock(v.duration);
  save();
});
v.addEventListener('ended', function () { save(true); stop(); });
v.addEventListener('pause', function () { osd(); });
v.addEventListener('error', function () {
  if (!cur) return;
  Room.toast('The TV can\'t play this file. MP4 (H.264) works best.', 5000);
  cur = null;
  stop();
});
window.addEventListener('beforeunload', function () { save(true); });

function act(k, c) {
  if (k === 'play' && c && c.id) { if (cur) stop(); choose(c.id); return; }
  if (cur) {
    if (k === 'enter' || k === 'play' || k === 'pause' || k === 'playpause') toggle();
    else if (k === 'left' || k === 'rw') seek(-10);
    else if (k === 'right' || k === 'ff') seek(30);
    else if (k === 'seek') seek(c && c.by || 0);
    else if (k === 'down' || k === 'subs') { if (sb) sb.toggle(); osd(5000); }
    else if (k === 'up' || k === 'info') osd(5000);
    else if (k === 'back' || k === 'stop' || k === 'list') stop();
    else return false;
    return;
  }
  if (k === 'down') jump(1);
  else if (k === 'up') jump(-1);
  else if (k === 'right') move(1);
  else if (k === 'left') move(-1);
  else if (k === 'enter' || k === 'play' || k === 'playpause') choose();
  else if (k === 'back') location.href = '/';
  else return false;
}

// How far the film you're waiting on has got, from iCloud's own figures on the Mac.
function progress() {
  var ids = Object.keys(waiting), id = ids[ids.length - 1], w = waiting[id];
  if (cur || !id) { document.getElementById('dl').className = 'dl'; return; }
  document.getElementById('dl').className = 'dl on';
  document.getElementById('dlT').textContent = w.title;
  Room.get('/api/movies/progress?id=' + encodeURIComponent(id)).then(function (p) {
    if (!waiting[id]) return;
    w.pct = p.pct;
    var done = p.pct && p.gb ? ' · ' + (p.gb * p.pct / 100).toFixed(1) + ' of ' + p.gb + ' GB' : p.gb ? ' · ' + p.gb + ' GB' : '';
    document.getElementById('dlC').textContent = p.pct > 0 ? p.pct + '%' + done + ' · starts when it\'s here'
      : 'Waiting for iCloud to start' + done + (p.on_power ? '' : ' · plug the Mac in to speed this up');
    document.getElementById('dlBar').style.width = (p.pct || 0) + '%';
  });
}

// A movie you asked iCloud for starts by itself once it lands, if you're still waiting on it.
setInterval(function () {
  progress();
  if (cur || !Object.keys(waiting).length) return;
  load().then(function () {
    var ready = list.filter(function (m) { return waiting[m.id] && !m.cloud; })[0];
    if (ready) play(ready);
  });
}, 4000);

load();
Room.keys(function (k) { return act(k); });
Room.poll(function (c) { act(c.key || c.do, c); });
Room.report(function () {
  return { channel: 'movies', title: cur ? cur.title : '', id: cur ? cur.id : '', t: cur ? Math.floor(v.currentTime) : 0,
           duration: cur && v.duration ? Math.floor(v.duration) : 0, playing: !!cur && !v.paused };
});
</script>
</body>
</html>
